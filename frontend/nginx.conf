# Cấu hình nginx cho ứng dụng React một trang (SPA).
# Mọi đường dẫn không phải file tĩnh (vd /courses/3) đều trả index.html
# để React Router tự hiển thị đúng trang, kể cả khi người dùng bấm F5.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # File có mã băm trong tên (do Vite tạo) được lưu đệm lâu dài
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
